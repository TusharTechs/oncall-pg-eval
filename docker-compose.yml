# OnCall-PG eval environment. Image pinned by digest for reproducibility.
x-pg-image: &pgimage postgres:17.11@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3

services:
  db:
    image: *pgimage
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/superuser_pw
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=trust"
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - max_wal_size=8GB
      - -c
      - checkpoint_timeout=30min
      - -c
      - log_lock_waits=on
      - -c
      - log_min_duration_statement=-1
    shm_size: 1g
    volumes:
      - ./.runtime/secrets:/run/secrets:ro
      - ./harness/db_init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1s
      retries: 60

  # App traffic (pgbench) and the analytics blocker. Holds latency logs.
  load:
    image: *pgimage
    entrypoint: ["sleep", "infinity"]
    depends_on: { db: { condition: service_healthy } }
    volumes:
      - ./runs:/runs
      - ./tickets:/tickets:ro
      - ./harness/load:/harness:ro

  # Runs the model's migration.sql as the unprivileged `migrator` role.
  # It sees ONLY the migration file: no grader files, no logs, no other passwords.
  migrator:
    image: *pgimage
    entrypoint: ["sleep", "infinity"]
    depends_on: { db: { condition: service_healthy } }
    volumes:
      - ./.runtime/migration:/migration:ro
